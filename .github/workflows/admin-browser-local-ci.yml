name: Admin navegador Auth Next local real

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-browser-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin-browser-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências existentes
        run: npm ci
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: "2.120.0"
      - name: Chromium e cliente PostgreSQL locais
        run: |
          node node_modules/playwright/cli.js install-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Controles puros sem serviços
        run: |
          node --test tests/scripts/admin-browser-support.test.mjs tests/scripts/admin-browser-local-ci.test.mjs
          node node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node --lib ES2022,DOM,DOM.Iterable tests/scripts/admin-browser.types.mts
      - name: Admin navegador local isolado
        run: |
          if env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_AUTH_LOCAL_CI_RUN="1" \
            SC_ADMIN_BROWSER_LOCAL_CI_RUN="1" \
            node scripts/verification/admin-browser-local-ci.mjs --execute; then
            sc_result=0
          else
            sc_result=$?
          fi
          # Keep the closed report inside the second-resolution step interval.
          sleep 2
          exit "$sc_result"
      # No raw output, trace, screenshots, downloads or artifact upload.
