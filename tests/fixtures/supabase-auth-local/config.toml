# Disposable GitHub Actions Auth-only stack; never link this project.
# The orchestrator substitutes only this literal project identifier.
project_id = "SC_AUTH_LOCAL_CI_PROJECT"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3117"
additional_redirect_urls = ["http://127.0.0.1:3117/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
# CLI maps this to GOTRUE_EXTERNAL_EMAIL_ENABLED, not global signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
