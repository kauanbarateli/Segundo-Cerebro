name: Diagnostico isolado da barreira online Chromium

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quiescence-fence-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-quiescence-fence-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependencias reproduziveis existentes
        run: npm ci
      - name: Controles RAM da barreira publica
        run: node --test --test-concurrency=1 tests/scripts/browser-quiescence-fence-probe.test.mjs
      - name: Chromium do produtor fixado
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Barreira online em fixture publica local
        run: |
          sleep 2
          if env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            TMPDIR="$RUNNER_TEMP" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            GITHUB_SHA="$GITHUB_SHA" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_BROWSER_QUIESCENCE_FENCE_PROBE_RUN="1" \
            node scripts/verification/browser-quiescence-fence-probe.mjs --execute; then
            sc_fence_result=0
          else
            sc_fence_result=$?
          fi
          sleep 2
          exit "$sc_fence_result"
      # Only one bounded closed JSON report; no private services or raw artifacts.
