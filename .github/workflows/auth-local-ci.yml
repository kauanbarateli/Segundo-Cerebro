name: Auth local real

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-local-${{ github.ref }}
  # Preserve the active runner's bounded finally/own-project cleanup.
  cancel-in-progress: false

jobs:
  auth-local:
    name: Aplicativo real + Supabase Auth descartável
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      SC_AUTH_LOCAL_CI_RUN: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências do aplicativo
        run: npm ci
      # Official source inspected 2026-10-10; fixed CLI, no login/link/PAT.
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: "2.120.0"
      - name: Cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Guardas da orquestração — sem serviço ou credencial
        run: |
          node --test tests/scripts/auth-local-ci.test.mjs
          node --test tests/e2e-auth-local/support.test.mjs
          node --test tests/scripts/auth-effect-outcome.test.mjs
      - name: Auth real no aplicativo — ambiente exclusivamente local
        run: |
          env -i \
            PATH="$PATH" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_AUTH_LOCAL_CI_RUN="1" \
            NEXT_TELEMETRY_DISABLED="1" \
            node scripts/verification/auth-local-ci.mjs --execute
      # No upload-artifact: browser/provider stdout, traces, HAR, screenshots,
      # cookies, fixture identities and key-bearing CLI output stay disabled.
