name: Recuperação por e-mail Auth Next local real
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-recovery-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  auth-recovery-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências existentes
        run: npm ci
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: "2.120.0"
      - name: Chromium e cliente PostgreSQL locais
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Controles puros sem serviços
        run: node --test tests/scripts/auth-recovery-local.test.mjs
      - name: Recuperação por e-mail local isolada
        run: |
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_AUTH_LOCAL_CI_RUN="1" \
            SC_AUTH_RECOVERY_LOCAL_CI_RUN="1" \
            node scripts/verification/auth-recovery-local-ci.mjs --execute
      # Local Mailpit1.31.3 only; no relay, message/URL/artifact upload.
