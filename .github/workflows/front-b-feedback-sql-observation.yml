name: Diagnóstico sintético da barreira de feedback

on:
  push:
    branches:
      - codex/front-b-feedback-sql-diagnostico
    paths:
      - .github/workflows/front-b-feedback-sql-observation.yml

permissions:
  contents: read

jobs:
  feedback-diagnostic:
    if: github.repository == 'kauanbarateli/Segundo-Cerebro'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Contratos puros
        run: node --test scripts/verification/front-b-feedback-reconciliation-draft/feedback-pglite-guard.test.mjs scripts/verification/front-b-feedback-reconciliation-draft/feedback-model.test.mjs scripts/verification/front-b-feedback-reconciliation-draft/reconciliation-domain.test.mjs
      - name: Diagnóstico PGlite em memória
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC FRONT_B_FEEDBACK_RUN_PGLITE=1 node --test scripts/verification/front-b-feedback-reconciliation-draft/feedback-pglite.opt-in.test.mjs
