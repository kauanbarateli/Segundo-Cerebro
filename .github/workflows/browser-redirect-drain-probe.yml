name: Diagnostico publico de redirect GET e drain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-redirect-drain-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-redirect-drain-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Dependencias reproduziveis existentes
        run: npm ci
      - name: Controles RAM da fixture publica
        run: node --test --test-concurrency=1 tests/scripts/browser-redirect-drain-probe.test.mjs
      - name: Chromium do produtor fixado
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Redirect GET e fonte encerrada em fixture publica
        run: |
          sleep 2
          if env -i \
            PATH="$PATH" HOME="$HOME" \
            LANG="${LANG:-C.UTF-8}" LC_ALL="${LC_ALL:-C.UTF-8}" TZ="UTC" \
            CI="true" GITHUB_ACTIONS="true" GITHUB_SHA="$GITHUB_SHA" \
            SC_BROWSER_REDIRECT_DRAIN_PROBE_RUN="1" \
            node scripts/verification/browser-redirect-drain-probe.mjs --execute; then
            sc_result=0
          else
            sc_result=$?
          fi
          sleep 2
          exit "$sc_result"
      # No artifacts, traces, screenshots, credentials or external services.
