name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Fundação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes de unidade e contratos
        run: npm test
      - name: Contrato de camadas da aplicação
        run: npm run check:layers
      - name: Tokens e contraste do design system
        run: npm run check:design-system
      - name: Build sem credenciais
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test no navegador
        run: npm run test:e2e
      - name: Evidências do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
