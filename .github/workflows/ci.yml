name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Fundação
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Official stable majors verified on 2026-10-07; each runs on Node 24.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache do engine Impeccable fixado
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/impeccable-cache/bin
          key: impeccable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.agents/skills/impeccable/scripts/VERSION') }}
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Dependências de produção
        run: npm audit --omit=dev
      - name: Segredos — assinaturas sem imprimir valores
        run: |
          node --test tests/scripts/check-secrets.test.mjs
          node scripts/check-secrets.mjs
      - name: Sintaxe SQL sem banco ou aplicação de migrations
        run: |
          python3 -m venv "${{ runner.temp }}/sql-check"
          "${{ runner.temp }}/sql-check/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/sql-validation-requirements.txt
          "${{ runner.temp }}/sql-check/bin/python" scripts/check-sql.py
      - name: Integridade do pacote SQL Editor e testes do gerador
        run: |
          npm run check:sql-editor
      - name: PostgreSQL descartável — fixtures sem conexão externa
        run: npm run test:local-sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes de unidade e contratos em UTC e São Paulo
        run: npm run test:timezones
      - name: Contratos dos scripts — Auth, concorrência, backup e release isolados
        run: npm run test:scripts
      - name: Contrato de camadas da aplicação
        run: npm run check:layers
      - name: Tokens e contraste do design system
        run: npm run check:design-system
      - name: Impeccable — integridade visual do código
        env:
          IMPECCABLE_HOME: ${{ runner.temp }}/impeccable-cache
        run: npm run check:impeccable
      - name: Build sem credenciais
        run: npm run build
      - name: Fronteira de autenticação no bundle do navegador
        run: |
          npm run check:client-auth
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E — fluxos, PWA e três portões visuais
        run: npm run test:e2e
      - name: Evidências do navegador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            !test-results/**/kit-*.txt
            work/impeccable-reports/
            docs/implementation/t005-visual-guards.md
          if-no-files-found: ignore
          retention-days: 7
