name: Admin backend local real

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-native-backend-local-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admin-native-backend-local:
    name: Admin original Core + Auth + PostgreSQL local
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reservar portas fixas apenas no runner descartável
        shell: bash
        env:
          SC_ADMIN_PORT_POLICY_RUN: "1"
          SC_POLICY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SC_POLICY_RUNNER_OS: ${{ runner.os }}
          SC_POLICY_JOB_CONTAINER_ID: ${{ job.container.id }}
          SC_POLICY_JOB_SERVICES_JSON: ${{ toJSON(job.services) }}
        run: |
          set -euo pipefail
          set +x
          node --max-old-space-size=128 --test tests/scripts/admin-port-reservation-plan.test.mjs
          node scripts/verification/admin-port-reservation-plan.mjs --check-scope
          umask 077
          snapshot_file="$(mktemp "$RUNNER_TEMP/sc-admin-port-policy.XXXXXX")"
          trap 'rm -f -- "$snapshot_file"' EXIT
          node scripts/verification/admin-port-reservation-plan.mjs --snapshot "$snapshot_file"
          reserved_value="$(node scripts/verification/admin-port-reservation-plan.mjs --check-before-apply "$snapshot_file")"
          if [[ "$reserved_value" != "NO_WRITE" ]]; then
            if [[ ! "$reserved_value" =~ ^[0-9,-]+$ || ${#reserved_value} -gt 65536 ]]; then
              printf '%s\n' '{"schemaVersion":1,"scenario":"admin-fixed-port-policy","code":"POLICY_VALUE_REFUSED"}'
              exit 1
            fi
            if ! sudo -n sysctl -q -w "net.ipv4.ip_local_reserved_ports=$reserved_value" >/dev/null 2>&1; then
              printf '%s\n' '{"schemaVersion":1,"scenario":"admin-fixed-port-policy","code":"POLICY_APPLY_FAILED"}'
              exit 1
            fi
          fi
          node scripts/verification/admin-port-reservation-plan.mjs --check-readback "$snapshot_file"
      - name: Dependências existentes
        run: npm ci
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: "2.120.0"
      - name: Cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Controles puros sem serviços
        run: |
          node --test tests/scripts/admin-native-backend-case.test.mjs tests/scripts/admin-native-backend-contract.test.mjs tests/scripts/admin-native-backend-local-case.test.mjs tests/scripts/admin-native-backend-local-ci.test.mjs
          node node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck --types node --lib ES2022,DOM,DOM.Iterable tests/scripts/admin-native-backend-local-ci.types.mts
      - name: Admin backend nativo isolado sem Next ou browser
        run: |
          env -i \
            PATH="$PATH" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_AUTH_LOCAL_CI_RUN="1" \
            SC_ADMIN_NATIVE_LOCAL_CI_RUN="1" \
            node scripts/verification/admin-native-backend-local-ci.mjs --execute
      # No artifact, raw CLI/provider output or credential upload.
