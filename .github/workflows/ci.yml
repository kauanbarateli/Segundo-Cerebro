name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Fundação
    runs-on: ubuntu-24.04
    # Includes image/bootstrap, all gates, browser evidence and post actions.
    # Individual test and native quiescence deadlines remain unchanged.
    # Original 42b5930 push passed 375 E2Es, then hit the 30m job limit.
    # Its own GitHub annotation confirms the outer execution timeout.
    # Only this outer budget changes; native/test deadlines and retries stay fixed.
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Official stable majors verified on 2026-10-07; each runs on Node 24.
      - uses: actions/checkout@v7
      - name: Confiar somente no checkout efêmero do job
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Baseline visual — dois commits históricos fixados
        run: git fetch --no-tags --depth=1 origin 69025764c00eee56fe56b3b3907cec70487c2bb2 053db2fc6ddc1da2439c6d0a15970167fc5d9862
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache do engine Impeccable fixado
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/impeccable-cache/bin
          key: impeccable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.agents/skills/impeccable/scripts/VERSION') }}
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Conferir os navegadores exatos da imagem oficial
        run: node scripts/verification/check-ci-browser-runtime.mjs
      - name: Dependências — auditoria completa
        run: npm audit
      - name: Segredos — assinaturas sem imprimir valores
        run: |
          node --test tests/scripts/check-secrets.test.mjs
          node scripts/check-secrets.mjs
      - name: Sintaxe SQL sem banco ou aplicação de migrations
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv "${{ runner.temp }}/sql-check"
          "${{ runner.temp }}/sql-check/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/sql-validation-requirements.txt
          "${{ runner.temp }}/sql-check/bin/python" scripts/check-sql.py
      - name: Integridade do pacote SQL Editor e testes do gerador
        run: |
          npm run check:sql-editor
      - name: PostgreSQL descartável — fixtures sem conexão externa
        run: npm run test:local-sql
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes de unidade e contratos em UTC e São Paulo
        run: npm run test:timezones
      - name: Contratos dos scripts — Auth, concorrência, backup e release isolados
        run: node --test --test-reporter=tap tests/scripts/*.test.mjs
      - name: Contrato de camadas da aplicação
        run: npm run check:layers
      - name: Tokens e contraste do design system
        run: npm run check:design-system
      - name: Impeccable — integridade visual do código
        env:
          IMPECCABLE_HOME: ${{ runner.temp }}/impeccable-cache
        run: npm run check:impeccable
      - name: Build sem credenciais
        run: npm run build
      - name: Fronteira de autenticação no bundle do navegador
        run: |
          npm run check:client-auth
      - name: Navegadores e bibliotecas da imagem oficial
        run: |
          node scripts/verification/check-ci-browser-runtime.mjs
          node node_modules/playwright/cli.js install-deps chromium
          node scripts/verification/check-ci-browser-runtime.mjs
      - name: E2E — fluxos, PWA e três portões visuais
        run: npm run test:e2e
      - name: Recapturar as oito variantes demo de Calendário e Kanban
        id: landing_gallery
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/mvp-goals-terminal-20261023' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --check scripts/landing/capture-gallery-ci.mjs
          node scripts/landing/capture-gallery-ci.mjs --check-contract
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=America/Sao_Paulo \
            CI=true GITHUB_ACTIONS=true GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            APP_MODE=demo NEXT_TELEMETRY_DISABLED=1 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            node scripts/landing/capture-gallery-ci.mjs
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
      - name: Guardar somente o lote completo Gallery ligado ao Source
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/mvp-goals-terminal-20261023' && steps.landing_gallery.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: landing-gallery-${{ github.sha }}-${{ steps.landing_gallery.outputs.source_tree }}
          # A single directory survives the runner's host→container path mapping.
          # The supervisor admits exactly the 17 allowlisted regular members,
          # with hashes and Source checked, before this step can succeed.
          path: ${{ runner.temp }}/landing-gallery-${{ github.sha }}-${{ steps.landing_gallery.outputs.source_tree }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Recapturar somente os quatro assets demo de Projetos
        id: landing_projects
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/mvp-goals-terminal-20261023' }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node --check scripts/landing/capture-project-ci.mjs
          node scripts/landing/capture-project-ci.mjs --check-contract
          env -i PATH="$PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=America/Sao_Paulo \
            CI=true GITHUB_ACTIONS=true GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            APP_MODE=demo NEXT_TELEMETRY_DISABLED=1 PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            node scripts/landing/capture-project-ci.mjs
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_tree" =~ ^[a-f0-9]{40}$ ]]
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
      - name: Guardar somente o lote completo de Projetos ligado ao Source
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/mvp-goals-terminal-20261023' && steps.landing_projects.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: landing-project-${{ github.sha }}-${{ steps.landing_projects.outputs.source_tree }}
          path: |
            src/components/features/conheca/telas/projeto.webp
            src/components/features/conheca/telas/projeto.webp.json
            src/components/features/conheca/telas/projeto-celular.webp
            src/components/features/conheca/telas/projeto-celular.webp.json
            src/components/features/conheca/telas/projeto-escuro.webp
            src/components/features/conheca/telas/projeto-escuro.webp.json
            src/components/features/conheca/telas/projeto-celular-escuro.webp
            src/components/features/conheca/telas/projeto-celular-escuro.webp.json
            docs/implementation/evidence/landing-project-capture.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Evidências do navegador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            !test-results/**/kit-*.txt
            work/ci-source-catalogues/finance027/*.json
            work/impeccable-reports/
            docs/implementation/t005-visual-guards.md
          if-no-files-found: ignore
          retention-days: 7
