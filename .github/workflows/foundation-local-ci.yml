name: Fundação Supabase local ledger tipos e RPC concorrente
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependências existentes
        run: npm ci
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: "2.120.0"
      - name: Cliente PostgreSQL local
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Controles puros sem serviços
        run: node --test tests/scripts/foundation-local-ci.test.mjs
      - name: Ledger geração de tipos e seis conexões PostgreSQL reais
        id: foundation-native
        run: |
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            LANG="${LANG:-C.UTF-8}" \
            LC_ALL="${LC_ALL:-C.UTF-8}" \
            TZ="UTC" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            CI="true" \
            GITHUB_ACTIONS="true" \
            SC_AUTH_LOCAL_CI_RUN="1" \
            SC_FOUNDATION_LOCAL_CI_RUN="1" \
            node scripts/verification/foundation-local-ci.mjs --execute
      # Public local generated source only; never data, Auth fixtures, env or logs.
      - name: Tipos public da cadeia local — bytes vinculados ao relatório
        if: always() && steps.foundation-native.outputs.types_export_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: foundation-local-public-types-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sc-foundation-public-types/types.ts
          retention-days: 1
          if-no-files-found: ignore
